<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge the Blocks</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07080f;
    --panel: #0d1020;
    --border: #1e2a4a;
    --accent: #00f5ff;
    --accent2: #ff3cac;
    --gold: #ffd700;
    --text: #e0e8ff;
    --muted: #4a5580;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Orbitron', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  #wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(12px, 3vw, 18px);
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,245,255,0.5);
    letter-spacing: 2px;
    text-align: center;
  }

  #hud {
    display: flex;
    gap: 24px;
    width: 100%;
    max-width: 500px;
    justify-content: space-between;
    align-items: center;
  }

  .hud-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    min-width: 100px;
    text-align: center;
  }

  .hud-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .hud-value {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    color: var(--accent);
  }

  #lives-display {
    font-size: 18px;
    letter-spacing: 4px;
  }

  #canvas-wrap {
    position: relative;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,245,255,0.08), inset 0 0 40px rgba(0,0,0,0.5);
  }

  canvas {
    display: block;
  }

  /* Overlay screens */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: rgba(7,8,15,0.88);
    backdrop-filter: blur(2px);
    transition: opacity 0.3s;
  }

  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 22px);
    text-align: center;
    line-height: 1.6;
  }

  .overlay-title.cyan { color: var(--accent); text-shadow: 0 0 30px rgba(0,245,255,0.6); }
  .overlay-title.red  { color: var(--accent2); text-shadow: 0 0 30px rgba(255,60,172,0.6); }

  .overlay-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.8;
  }

  .final-score {
    font-family: 'Press Start 2P', monospace;
    font-size: 28px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.5);
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 12px 28px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: background 0.2s, box-shadow 0.2s;
  }

  .btn:hover {
    background: rgba(0,245,255,0.1);
    box-shadow: 0 0 16px rgba(0,245,255,0.3);
  }

  #level-announce {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 20px);
    color: var(--gold);
    text-shadow: 0 0 20px rgba(255,215,0,0.7);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.3s;
    z-index: 10;
  }

  #controls-hint {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
  }

  /* Mobile touch buttons */
  #touch-controls {
    display: none;
    gap: 40px;
    margin-top: 4px;
  }

  .touch-btn {
    width: 64px;
    height: 64px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--accent);
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
  }

  .touch-btn:active { background: rgba(0,245,255,0.15); }

  @media (max-width: 540px) {
    #touch-controls { display: flex; }
    #controls-hint { display: none; }
  }
</style>
</head>
<body>

<div id="wrapper">
  <h1>DODGE THE BLOCKS</h1>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SKOR</div>
      <div class="hud-value" id="score-el">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">NYAWA</div>
      <div class="hud-value" id="lives-el">♥♥♥</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">LEVEL</div>
      <div class="hud-value" id="level-el">1</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">BEST</div>
      <div class="hud-value" id="best-el">0</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>

    <!-- Start screen -->
    <div class="overlay" id="screen-start">
      <div class="overlay-title cyan">SIAP BERMAIN?</div>
      <div class="overlay-sub">Hindari semua blok yang jatuh<br>Kamu punya 3 nyawa</div>
      <button class="btn" id="btn-start">▶ MULAI</button>
      <div class="overlay-sub">← → / A D untuk bergerak</div>
    </div>

    <!-- Game over screen -->
    <div class="overlay hidden" id="screen-over">
      <div class="overlay-title red">GAME OVER</div>
      <div class="final-score" id="final-score-el">0</div>
      <div class="overlay-sub" id="over-msg">—</div>
      <button class="btn" id="btn-restart">↺ MAIN LAGI</button>
    </div>

    <div id="level-announce"></div>
  </div>

  <div id="controls-hint">← → atau A D untuk bergerak &nbsp;|&nbsp; Setiap 500 poin = naik level</div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  const vw = Math.min(window.innerWidth - 32, 500);
  const vh = Math.min(window.innerHeight - 260, 500);
  const size = Math.min(vw, vh, 500);
  canvas.width = size;
  canvas.height = Math.round(size * 0.82);
}
resize();
window.addEventListener('resize', resize);

const W = () => canvas.width;
const H = () => canvas.height;

// State
let state = 'start';
let score, best, lives, level, frame;
let player, blocks, particles, stars;
let invincible, invTimer;
let prevLevel;

const BLOCK_COLORS = [
  '#ff3cac','#ff6b35','#ffd700','#00f5ff','#a855f7','#22c55e','#f43f5e'
];

function initGame() {
  score = 0; lives = 3; level = 1; frame = 0;
  invincible = false; invTimer = 0; prevLevel = 1;
  best = parseInt(localStorage.getItem('dtb_best') || '0');

  player = {
    x: W() / 2 - 16, y: H() - 52,
    w: 32, h: 32,
    vx: 0, speed: 5
  };

  blocks = [];
  particles = [];
  stars = Array.from({ length: 60 }, () => ({
    x: Math.random() * W(),
    y: Math.random() * H(),
    r: Math.random() * 1.5 + 0.3,
    speed: Math.random() * 0.4 + 0.1,
    alpha: Math.random() * 0.6 + 0.2
  }));

  updateHUD();
  document.getElementById('best-el').textContent = best;
}

function updateHUD() {
  document.getElementById('score-el').textContent = score;
  document.getElementById('level-el').textContent = level;
  const hearts = '♥'.repeat(lives) + '♡'.repeat(Math.max(0, 3 - lives));
  document.getElementById('lives-el').textContent = hearts;
  document.getElementById('lives-el').style.color = lives === 1 ? '#ff3cac' : '#00f5ff';
}

function spawnBlock() {
  const w = 24 + Math.random() * 44;
  const h = 16 + Math.random() * 14;
  const color = BLOCK_COLORS[Math.floor(Math.random() * BLOCK_COLORS.length)];
  const speed = 1.8 + level * 0.65 + Math.random() * 1.2;
  const x = Math.random() * (W() - w);
  blocks.push({ x, y: -h - 10, w, h, vy: speed, color, glow: color });
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 45, maxLife: 45,
      r: Math.random() * 3 + 1,
      color
    });
  }
}

function showLevelAnnounce(lv) {
  const el = document.getElementById('level-announce');
  el.textContent = `LEVEL ${lv}`;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1200);
}

// Drawing
function drawStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H()) { s.y = 0; s.x = Math.random() * W(); }
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  const { x, y, w, h } = player;
  if (invincible && Math.floor(frame / 4) % 2 === 1) return;

  const cx = x + w / 2;

  // Engine glow
  ctx.save();
  ctx.globalAlpha = 0.4 + Math.sin(frame * 0.2) * 0.15;
  ctx.fillStyle = '#00f5ff';
  ctx.beginPath();
  ctx.ellipse(cx, y + h + 4, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Ship body
  ctx.save();
  ctx.shadowColor = '#00f5ff';
  ctx.shadowBlur = 14;

  // Main hull
  ctx.fillStyle = '#0a2a4a';
  ctx.beginPath();
  ctx.moveTo(cx, y);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(cx, y + h - 6);
  ctx.lineTo(x, y + h);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#00f5ff';
  ctx.globalAlpha = 0.8;
  ctx.beginPath();
  ctx.moveTo(cx, y + 4);
  ctx.lineTo(cx + 8, y + h - 10);
  ctx.lineTo(cx - 8, y + h - 10);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBlock(b) {
  ctx.save();
  ctx.shadowColor = b.glow;
  ctx.shadowBlur = 10;
  ctx.fillStyle = b.color;
  ctx.fillRect(b.x, b.y, b.w, b.h);

  // Shine
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(b.x + 4, b.y + 3, b.w - 8, 4);
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Bottom floor line
  ctx.strokeStyle = 'rgba(0,245,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H() - 14);
  ctx.lineTo(W(), H() - 14);
  ctx.stroke();
}

function collide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' && state !== 'playing') tryStart();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Touch controls
const btnL = document.getElementById('btn-left');
const btnR = document.getElementById('btn-right');
btnL.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; }, { passive: false });
btnL.addEventListener('touchend', () => { keys['ArrowLeft'] = false; });
btnR.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; }, { passive: false });
btnR.addEventListener('touchend', () => { keys['ArrowRight'] = false; });

canvas.addEventListener('touchstart', e => {
  if (state !== 'playing') tryStart();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  if (t.clientX - rect.left < W() / 2) keys['ArrowLeft'] = true;
  else keys['ArrowRight'] = true;
}, { passive: true });
canvas.addEventListener('touchend', () => {
  keys['ArrowLeft'] = false; keys['ArrowRight'] = false;
});

function tryStart() {
  if (state === 'start') startGame();
  else if (state === 'over') restartGame();
}

// UI
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', restartGame);

function startGame() {
  document.getElementById('screen-start').classList.add('hidden');
  state = 'playing';
  initGame();
  requestAnimationFrame(loop);
}

function restartGame() {
  document.getElementById('screen-over').classList.add('hidden');
  state = 'playing';
  initGame();
  requestAnimationFrame(loop);
}

function gameOver() {
  state = 'over';
  if (score > best) {
    best = score;
    localStorage.setItem('dtb_best', best);
  }
  document.getElementById('final-score-el').textContent = score;
  const msg = score > best
    ? `REKOR BARU! BEST: ${best}`
    : `BEST: ${best}`;
  document.getElementById('over-msg').textContent = msg;
  document.getElementById('best-el').textContent = best;
  document.getElementById('screen-over').classList.remove('hidden');
}

let raf;
function loop() {
  if (state !== 'playing') return;
  frame++;

  // Movement
  if (keys['ArrowLeft'] || keys['KeyA']) player.vx = -player.speed;
  else if (keys['ArrowRight'] || keys['KeyD']) player.vx = player.speed;
  else player.vx *= 0.75;

  player.x += player.vx;
  player.x = Math.max(0, Math.min(W() - player.w, player.x));
  player.y = H() - 52;

  // Spawn blocks — faster at higher levels
  const spawnRate = Math.max(8, 50 - level * 5);
  if (frame % spawnRate === 0) spawnBlock();

  // Move blocks
  blocks.forEach(b => { b.y += b.vy; });
  blocks = blocks.filter(b => b.y < H() + 40);

  // Invincibility timer
  if (invincible) { invTimer--; if (invTimer <= 0) invincible = false; }

  // Collision
  if (!invincible) {
    for (let i = blocks.length - 1; i >= 0; i--) {
      if (collide(player, blocks[i])) {
        spawnParticles(player.x + 16, player.y + 16, '#ff3cac', 14);
        lives--;
        updateHUD();
        invincible = true;
        invTimer = 100;
        blocks.splice(i, 1);
        if (lives <= 0) { gameOver(); return; }
        break;
      }
    }
  }

  // Score & level
  score++;
  const newLevel = 1 + Math.floor(score / 500);
  if (newLevel !== prevLevel) {
    level = newLevel;
    prevLevel = newLevel;
    showLevelAnnounce(level);
    // Bonus life every 2 levels, max 5
    if (level % 2 === 0 && lives < 5) {
      lives++;
      spawnParticles(player.x + 16, player.y + 16, '#00f5ff', 10);
    }
    updateHUD();
  }

  if (frame % 2 === 0) {
    document.getElementById('score-el').textContent = score;
  }

  // Engine trail particles
  if (frame % 3 === 0) {
    particles.push({
      x: player.x + player.w / 2 + (Math.random() - 0.5) * 8,
      y: player.y + player.h,
      vx: (Math.random() - 0.5) * 0.8,
      vy: 1.5 + Math.random(),
      life: 20, maxLife: 20,
      r: Math.random() * 2 + 1,
      color: '#00f5ff'
    });
  }

  // Update particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // Draw
  ctx.fillStyle = '#07080f';
  ctx.fillRect(0, 0, W(), H());

  drawStars();
  drawHUD();
  drawParticles();
  blocks.forEach(drawBlock);
  drawPlayer();

  raf = requestAnimationFrame(loop);
}

// Initial render
initGame();
ctx.fillStyle = '#07080f';
ctx.fillRect(0, 0, W(), H());
drawStars();
</script>
</body>
</html>
